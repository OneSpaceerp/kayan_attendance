[project]
name = "kayan_attendance"
authors = [{ name = "Nest Software Development", email = "info@nsd-eg.com" }]
description = "Attendance watchdog for Frappe HR: automatic check-out for open check-ins and check-in time extensions, in step with the Frappe HR mobile app"
requires-python = ">=3.10"
readme = "README.md"
license = "GPL-3.0-or-later"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
hrms = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "B904", "W191", "E101", "F401", "F403", "F405", "E402", "RUF001"]

[tool.ruff.format]
quote-style = "double"
