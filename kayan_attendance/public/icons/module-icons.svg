<!-- Dual-tone module icons for the desk dock and sidebar headers (Frappe v16), drawn on the same 24 px
     grid as the ERPNext and HRMS sprites: "-duotone" symbols filled from --duotone-light and
     --duotone-dark for sidebar headers, "-soft" symbols in the shared soft-icon classes for the dock.

     This sprite is inserted into the page, so the style block below is a document stylesheet. -->

<svg id="kayan-attendance-module-symbols" aria-hidden="true" style="display: none;" class="icon" xmlns="http://www.w3.org/2000/svg">
	<style>
		.shell-header:hover .header-logo,
		.shell-header.hover .header-logo {
			--duotone-light: light-dark(var(--ink-gray-3), var(--ink-gray-4));
		}
		.dock-item--duotone.active {
			--duotone-light: var(--ink-gray-4);
			--duotone-dark: light-dark(var(--ink-gray-6), var(--ink-gray-7));
		}
		/* Kayan Attendance: the check badge pops a little while the dock tile is hovered. */
		.kayan-attendance-badge {
			transform-box: view-box;
			transform-origin: 18px 17.5px;
			transform: scale(calc(1 + var(--icon-motion-opacity, 0) * 0.08));
			transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
		}
		/* Setup: the cog turns while hovered. */
		.kayan-setup-cog {
			transform-box: view-box;
			transform-origin: 17px 17px;
			animation: kayan-setup-turn 3s linear infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes kayan-setup-turn {
			to { transform: rotate(360deg); }
		}
		@media (prefers-reduced-motion: reduce) {
			.kayan-attendance-badge { transition: none; transform: none; }
			.kayan-setup-cog { animation: none; }
		}
	</style>

	<!-- Kayan Attendance: a person with a check badge, as in the app logo -->
	<symbol viewBox="0 0 24 24" id="icon-kayan-attendance-duotone" stroke="none" style="overflow: visible">
		<circle cx="9.5" cy="6.75" r="4.25" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<path d="M2.5 21.25V19.5Q2.5 13.25 8.5 13.25H10.5Q12.6 13.25 14.1 14.1A6.6 6.6 0 0 0 12.2 21.25Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<path class="kayan-attendance-badge" fill-rule="evenodd" d="M13 17.5A5 5 0 1 0 23 17.5A5 5 0 1 0 13 17.5ZM15.35 17.65L16.4 16.6L17.45 17.65L19.6 15.5L20.65 16.55L17.45 19.75Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
	</symbol>
	<symbol id="icon-kayan-attendance-soft" viewBox="0 0 24 24" class="soft-icon">
		<circle cx="9.5" cy="7" r="4" class="soft-body"/>
		<circle cx="9.5" cy="7" r="4"/>
		<path d="M3 21v-1.5A5.5 5.5 0 0 1 8.5 14h2.5c.7 0 1.4.1 2 .35"/>
		<g class="kayan-attendance-badge">
			<circle cx="18" cy="17.5" r="4.25" class="soft-accent"/>
			<path d="m16.1 17.6 1.3 1.3 2.6-2.6"/>
		</g>
	</symbol>

	<!-- Kayan Attendance Setup: the watchdog's clock with a cog -->
	<symbol viewBox="0 0 24 24" id="icon-kayan-setup-duotone" stroke="none" style="overflow: visible">
		<path fill-rule="evenodd" d="M1.5 10A8.5 8.5 0 1 0 18.5 10A8.5 8.5 0 1 0 1.5 10ZM9.2 4.75H10.8V9.2H14.25V10.8H9.2Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<g class="kayan-setup-cog">
			<path fill-rule="evenodd" d="M16.1 11.2H17.9L18.3 12.9L19.7 13.5L21.2 12.6L22.5 13.9L21.6 15.4L22.2 16.8L23.9 17.2V19L22.2 19.4L21.6 20.8L22.5 22.3L21.2 23.6L19.7 22.7L18.3 23.3L17.9 25H16.1L15.7 23.3L14.3 22.7L12.8 23.6L11.5 22.3L12.4 20.8L11.8 19.4L10.1 19V17.2L11.8 16.8L12.4 15.4L11.5 13.9L12.8 12.6L14.3 13.5L15.7 12.9ZM17 16.1A2 2 0 1 0 17 20.1A2 2 0 1 0 17 16.1Z" transform="translate(0 -1.1)" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		</g>
	</symbol>
	<symbol id="icon-kayan-setup-soft" viewBox="0 0 24 24" class="soft-icon">
		<circle cx="10" cy="10" r="7.75" class="soft-body"/>
		<path d="M11.2 17.65A7.75 7.75 0 1 1 17.65 11.2"/>
		<path d="M10 5.5V10h3.5"/>
		<g class="kayan-setup-cog">
			<circle cx="17" cy="17" r="3.6" class="soft-accent"/>
			<path d="M17 11.5v1.4m0 8.2V22.5m5.5-5.5h-1.4m-8.2 0H11.5m9.39-3.89-1 1m-5.78 5.78-1 1m7.78 0-1-1m-5.78-5.78-1-1"/>
			<circle cx="17" cy="17" r="1.3"/>
		</g>
	</symbol>
</svg>
